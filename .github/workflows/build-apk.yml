name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      backendBaseUrl:
        description: "Override the licensing backend's HTTPS base URL for this build only (falls back to the repo's BACKEND_BASE_URL variable, then the build.gradle.kts default, when left blank)"
        required: false

env:
  HYSTERIA_VERSION: "app/v2.13.0"
  HEV_TUNNEL_VERSION: "2.18.0"
  XRAY_CORE_REF: "main"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The old default "tools" package was removed from Google's repo years
          # ago; only ask for what we actually need.
          packages: "platform-tools"

      - name: Install SDK platform, build-tools and NDK
        run: |
          set -eux
          # `yes` gets SIGPIPE once sdkmanager stops reading stdin at the end
          # of the install; that's expected and harmless, so this line is
          # deliberately not run under `pipefail` — success is checked for
          # real below instead of trusting this command's own exit code.
          yes | sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" || true
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -d "$ANDROID_SDK_ROOT/build-tools/34.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/26.3.11579264"

      - name: Fetch hysteria client binaries (official release, apernet/hysteria)
        run: |
          set -euxo pipefail
          declare -A map=( [arm64-v8a]=arm64 [armeabi-v7a]=armv7 [x86_64]=amd64 [x86]=386 )
          for abi in "${!map[@]}"; do
            goarch="${map[$abi]}"
            dir="app/src/main/jniLibs/$abi"
            mkdir -p "$dir"
            url="https://github.com/apernet/hysteria/releases/download/${HYSTERIA_VERSION}/hysteria-android-${goarch}"
            curl -fL --retry 3 -o "$dir/libhysteria.so" "$url"
            chmod +x "$dir/libhysteria.so"
          done

      - name: Build Xray-core binaries (vmess/vless/trojan/shadowsocks/socks engine)
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "${XRAY_CORE_REF}" https://github.com/XTLS/Xray-core.git /tmp/xray-src
          cd /tmp/xray-src
          # Prefer the newest release tag over the branch HEAD above, when one exists —
          # this only narrows what we already have, so a lookup failure just means we
          # build the branch we cloned instead of silently doing nothing.
          latest_tag="$(git ls-remote --tags --refs https://github.com/XTLS/Xray-core.git \
            | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -n "$latest_tag" ]; then
            git fetch --depth 1 origin "refs/tags/$latest_tag:refs/tags/$latest_tag"
            git checkout "refs/tags/$latest_tag"
          fi
          echo "Building Xray-core @ $(git rev-parse --short HEAD) ($(git describe --tags --always))"

          # GOOS=android needs cgo (external linking) for at least 386 — confirmed by a
          # failed CI run that built fine for arm64/arm/amd64 with CGO_ENABLED=0 but hit
          # "android/386 requires external (cgo) linking, but cgo is not enabled". Rather
          # than special-case one ABI, every ABI uses the NDK's clang here (api 24, matching
          # minSdk/APP_PLATFORM elsewhere in this workflow) — the same technique real Android
          # Go builds (e.g. v2rayNG's libv2ray) use.
          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          declare -A goarch_map=( [arm64-v8a]=arm64 [armeabi-v7a]=arm [x86_64]=amd64 [x86]=386 )
          declare -A cc_map=(
            [arm64-v8a]="$NDK_BIN/aarch64-linux-android24-clang"
            [armeabi-v7a]="$NDK_BIN/armv7a-linux-androideabi24-clang"
            [x86_64]="$NDK_BIN/x86_64-linux-android24-clang"
            [x86]="$NDK_BIN/i686-linux-android24-clang"
          )
          for abi in "${!goarch_map[@]}"; do
            goarch="${goarch_map[$abi]}"
            cc="${cc_map[$abi]}"
            test -x "$cc"
            dir="$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi"
            mkdir -p "$dir"
            # -checklinkname=0: github.com/wlynxg/anet (a wireguard-go dependency) uses a
            # //go:linkname into the std "net" package's private zoneCache; Go >=1.23 refuses
            # that by default ("invalid reference to net.zoneCache") unless this is passed —
            # see https://github.com/wlynxg/anet's README.
            env CGO_ENABLED=1 CC="$cc" GOOS=android GOARCH="$goarch" GOARM=7 \
              go build -trimpath -ldflags "-s -w -checklinkname=0" -o "$dir/libxray.so" ./main
            chmod +x "$dir/libxray.so"
          done

      - name: Build hev-socks5-tunnel native library (ndk-build)
        run: |
          set -euxo pipefail
          mkdir -p /tmp/hev-build
          git clone --recursive --branch "${HEV_TUNNEL_VERSION}" --depth 1 \
            https://github.com/heiher/hev-socks5-tunnel /tmp/hev-build/jni
          "$ANDROID_NDK_ROOT/ndk-build" -C /tmp/hev-build NDK_PROJECT_PATH=/tmp/hev-build \
            APP_PLATFORM=android-24 \
            APP_ABI="arm64-v8a armeabi-v7a x86_64 x86"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            dir="app/src/main/jniLibs/$abi"
            mkdir -p "$dir"
            cp "/tmp/hev-build/libs/$abi/libhev-socks5-tunnel.so" "$dir/"
          done

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          # The licensing backend's HTTPS base URL, baked into BuildConfig.BACKEND_BASE_URL
          # (see app/build.gradle.kts). Precedence: a manual dispatch's "backendBaseUrl" input
          # wins when given, otherwise the repo/org "Variable" named BACKEND_BASE_URL (Settings >
          # Secrets and variables > Actions > Variables) is used, otherwise the build.gradle.kts
          # default placeholder is used, and the app will show a "could not reach the server"
          # error for any key, which is expected and harmless.
          BACKEND_BASE_URL: ${{ inputs.backendBaseUrl || vars.BACKEND_BASE_URL }}
        run: |
          if [ -n "$BACKEND_BASE_URL" ]; then
            ./gradlew assembleDebug --no-daemon "-PbackendBaseUrl=$BACKEND_BASE_URL"
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dripwire-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK
        env:
          BACKEND_BASE_URL: ${{ inputs.backendBaseUrl || vars.BACKEND_BASE_URL }}
          # Real production signing — only present once the four SIGNING_* repo secrets are
          # added under Settings > Secrets and variables > Actions > Secrets (see README).
          # Until then app/build.gradle.kts falls back to debug signing automatically, so this
          # step still succeeds either way — it just won't be the APK to hand out to real users.
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Signing release APK with the real production keystore."
          else
            echo "No SIGNING_* secrets configured yet — release APK will be debug-signed (minified/optimized, but not the build to distribute). See README."
          fi
          if [ -n "$BACKEND_BASE_URL" ]; then
            ./gradlew assembleRelease --no-daemon "-PbackendBaseUrl=$BACKEND_BASE_URL"
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dripwire-vpn-release-apk
          path: app/build/outputs/apk/release/*.apk
